name: Colony Counter - Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # Attiva la cache per i push successivi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installa la versione LIGHT di torch (solo CPU) 
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Installa il resto (cellpose, opencv, ecc.)
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests -v