name: Colony Counter - Run Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installiamo la versione CPU di torch e torchvision (molto più leggera)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # Installiamo il resto dal tuo requirements
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests -v

      - name: Run Analysis
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          # Crea la cartella results se non esiste
          mkdir -p results
          # Esegue lo script che abbiamo creato
          python run_analysis.py 
          
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: analisi-colonie-risultati
          path: |
            results/
            *.png
  
        if: always() 
      